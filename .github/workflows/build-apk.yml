name: Build 胖錢包計算機 App v1.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pangwallet-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v1.1 APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
          "release/胖錢包計算機_App_v1.1_CreamDenim_Widget.apk"

      - name: Upload v1.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: 胖錢包計算機-App-v1.1-APK
          path: release/胖錢包計算機_App_v1.1_CreamDenim_Widget.apk
          if-no-files-found: error
